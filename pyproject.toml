[project]
name = "open-city-profile"
requires-python = ">=3.12, <3.13"
version = "2.13.4"
dependencies = [
    "django~=5.2",
    "django-admin-sortable",
    "django-cors-headers",
    "django-csp<4",
    "django-enumfields2",
    "django-environ",
    "django-filter",
    "django-guardian",
    "django-helsinki-health-endpoints",
    "django-helusers",
    "django-logger-extra",
    "django-parler<2.4",
    "django-resilient-logger==1.1.1",
    "django-sanitized-dump",
    "django-searchable-encrypted-fields",
    "graphene-django",
    "graphene-federation==3.1.4",
    "graphene-validator@https://github.com/City-of-Helsinki/graphene-validator/archive/refs/heads/graphene3.zip",
    "graphql-core==3.2.6",
    "graphql-sync-dataloaders",
    "iso3166",
    "psycopg[c]",
    "pyjwt[crypto]",
    "pyyaml",
    "requests",
    "requests-oauthlib",
    "sentry-sdk",
    "social-auth-app-django<6",
]

[dependency-groups]
dev = [
    "factory-boy",
    "freezegun",
    "inflection",
    "ipython",
    "pre-commit",
    "pytest",
    "pytest-cov",
    "pytest-django",
    "pytest-factoryboy",
    "pytest-mock",
    "requests-mock",
    "syrupy",
]
prod = [
    "uwsgi<3",
    "uwsgitop",
]

[tool.uv]
package = false
required-version = ">=0.9.17"
exclude-newer = "P3D"

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = [
    # Pyflakes
    "F",
    # pycodestyle
    "E",
    "W",
    # isort
    "I",
    # pep8-naming
    "N",
    # flake8-bugbear without opinionated rules
    "B0",
    # flake8-pie
    "PIE",
    # flake8-print
    "T20",
    # pyupgrade
    "UP",
]
extend-per-file-ignores = { "*/migrations/*" = ["E501"], "*/tests/*" = ["E501"] }

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "open_city_profile.tests.settings"
norecursedirs = [".git", "venv*", ".venv*"]
doctest_optionflags = ["NORMALIZE_WHITESPACE", "IGNORE_EXCEPTION_DETAIL", "ALLOW_UNICODE"]

[tool.coverage.run]
branch = true
omit = ["*migrations*", "*site-packages*", "*venv*", "*tests*"]
